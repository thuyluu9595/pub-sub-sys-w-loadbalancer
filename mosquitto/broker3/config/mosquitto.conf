# Mosquitto Broker 3 Configuration

# Network
listener 1883
protocol mqtt

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# Connection limits
max_connections -1
max_queued_messages 1000

# Security (for testing - allow anonymous)
allow_anonymous true

# Message size
message_size_limit 0

# QoS
max_qos 2
